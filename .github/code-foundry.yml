version: 1
features: all
license: apache-2.0
prune_standard: true
profile: monorepo
languages: typescript
codeql: auto
dependency_review: auto
package_manager: bun
codeql_rust_shards: '["all"]'
codeql_rust_threads: 1
codeql_rust_max_parallel: 1
runtime_repository: 0xPlayerOne/code-foundry
runtime_ref: v0.40.1
runner: ubuntu-latest
ci_runner: ubuntu-latest
test_runner: ubuntu-latest
unit_runner: ubuntu-latest
security_runner: ubuntu-latest
codeql_runner: ubuntu-latest
pr_runner: ubuntu-latest
release_runner: ubuntu-latest
toolchain: auto
staging_validation_mode: audit
cache_packages: auto
cache_build: auto
coverage_minimum: 80
turbo_remote: auto
release_type: node
npm_publish: false
post_release: false
post_release_workflow:
post_release_mode: auto
opencode_security: true
sync_mode: overlay
custom_workflows: preserve
git_workflow: staging-release
merge_strategy: rebase
release_merge_strategy: rebase
opencode_security_model:
