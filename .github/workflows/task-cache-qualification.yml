name: Task cache qualification

# Production builds only; no private asset fetch, service calls or deployment.
# Default-branch runs seed the cache; pull requests may only read it.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'scripts/orch-*'
      - '.github/workflows/task-cache-qualification.yml'
  pull_request:
    types: [ready_for_review, synchronize]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'scripts/orch-*'
      - 'packages/ui/scripts/orch-*'
      - '.github/workflows/task-cache-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-cache-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-build:
    if: vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the task cache contract test
        run: bun test tests/task-cache-qualification.test.mjs
      - name: Restore production task cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: production-tasks-v2-${{ runner.os }}-${{ runner.arch }}-node24.21.0-bun1.4.3-vp1.3.0-${{ hashFiles('bun.lock', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            production-tasks-v2-${{ runner.os }}-${{ runner.arch }}-node24.21.0-bun1.4.3-vp1.3.0-${{ hashFiles('bun.lock', 'vite.config.ts') }}-
      - name: Qualify the production task cache
        env:
          RESTORED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          qualification="$RUNNER_TEMP/task-cache-qualification"
          mkdir -p "$qualification"
          head="$(git rev-parse HEAD)"
          proof=node_modules/.vite/task-cache/qualification-head
          previous="$(cat "$proof" 2>/dev/null || true)"
          qualify="node scripts/task-cache-qualification.mjs"
          export PATH="$PWD/node_modules/.bin:$PATH"

          # The cache the runner restored, before any build touches it.
          $qualify cache-state --out "$qualification/restored-cache.json"

          # The declared outputs are removed before every build this lane
          # compares, so each build has to produce or restore all of them and
          # none of them can be left over on disk. Only the outputs the build
          # graph declares are removed.
          $qualify clean-outputs --out "$qualification/cleaned-first.json"

          # The first build. A restored cache for this commit must serve every
          # task, and the run summary says which task came from the cache.
          bun run build
          $qualify summary --out "$qualification/first-summary.json"
          if test "$previous" = "$head"; then
            $qualify summary --expect hits --out "$qualification/restored-summary.json"
            echo 'The restored cache served every task for this commit.' >> "$GITHUB_STEP_SUMMARY"
          fi
          $qualify inventory --out "$qualification/first-inventory.json"

          # The replay must come entirely from the cache and must restore the
          # outputs the first build produced, byte for byte. The declared
          # outputs are removed first, so the replay has to restore them from
          # the cache instead of finding them left over on disk.
          $qualify clean-outputs --out "$qualification/cleaned-replay.json"
          bun run build
          $qualify summary --expect hits --out "$qualification/replay-summary.json"
          $qualify inventory --out "$qualification/replay-inventory.json"
          $qualify compare "$qualification/first-inventory.json" "$qualification/replay-inventory.json"

          # A changed source invalidates the task that owns it and nothing else.
          probe=packages/contracts/src/index.ts
          cp "$probe" "$qualification/probe.bak"
          printf '\n// task cache qualification probe\n' >> "$probe"
          vp run orch:contracts:build
          $qualify summary --scope orch:contracts:build --expect invalidated:source=orch:contracts:build --out "$qualification/source-summary.json"
          mv "$qualification/probe.bak" "$probe"

          # Reseed the source baseline. The source probe left an entry for the
          # changed source, so the cache is emptied and the scoped task is
          # rebuilt from the restored source before the configuration probe.
          # Only then is a configuration miss attributable to the configuration.
          vp cache clean
          vp run orch:contracts:build
          $qualify summary --scope orch:contracts:build --expect misses --out "$qualification/reseed-summary.json"

          # A changed configuration input invalidates the scoped task, and the
          # invalidation has to name the configuration input that changed.
          cp package.json "$qualification/package.json.bak"
          node --input-type=module <<'PROBE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const text = readFileSync('package.json', 'utf8')
          writeFileSync('package.json', text.replace('"private": true,', '"private": true, '))
          PROBE
          vp run orch:contracts:build
          $qualify summary --scope orch:contracts:build --expect invalidated:config=orch:contracts:build --out "$qualification/config-summary.json"
          mv "$qualification/package.json.bak" package.json

          # A clean build must reproduce exactly the outputs the cached replay
          # restored, and the cache it leaves behind must hold one entry per
          # cached task the build graph declares. The declared outputs are
          # removed first, so the clean build has to produce all of them.
          $qualify clean-outputs --out "$qualification/cleaned-baseline.json"
          vp cache clean
          bun run build
          $qualify summary --expect misses --out "$qualification/clean-summary.json"
          $qualify inventory --out "$qualification/clean-inventory.json"
          $qualify compare "$qualification/replay-inventory.json" "$qualification/clean-inventory.json"
          $qualify cache-state --expect-entries graph --out "$qualification/clean-cache.json"

          # The cache now holds exactly the entries of this commit.
          printf '%s\n' "$head" > "$proof"
          echo "Restored entry: ${RESTORED_KEY:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Save production task cache
        if: success() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
