name: Foundation Acceptance

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-acceptance-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    name: Core
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full dependency history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch audit provenance branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Setup pinned Bun
        run: npm install --global bun@1.4.0
      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(bun --version)" = "$(cat .bun-version)"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run core foundation acceptance
        run: bun scripts/run-foundation-acceptance.mjs --skip-install --skip-containers

  containers:
    name: Containers
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build all service and migration images
        run: >-
          docker buildx bake -f infrastructure/containers/docker-bake.hcl
          default database-migrate --set '*.platform=linux/amd64'

  # Stable required check: Foundation Acceptance / Gate
  gate:
    name: Foundation Acceptance / Gate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [core, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONTAINERS_RESULT: ${{ needs.containers.result }}
      CORE_RESULT: ${{ needs.core.result }}
    steps:
      - name: Require every foundation lane
        run: |
          test "$CORE_RESULT" = success
          test "$CONTAINERS_RESULT" = success
