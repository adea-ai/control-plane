name: M10 Operability

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m10-operability-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:m10-conformance
      - run: bun run test:m10-operability

  hosted-compose:
    name: Hosted Compose
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Launch and disrupt supported Hosted profiles
        working-directory: infrastructure/compose
        shell: bash
        run: bash ../../scripts/run-hosted-compose-acceptance.sh

  gate:
    name: M10 Operability / Gate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [contracts, hosted-compose]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONTRACTS_RESULT: ${{ needs.contracts.result }}
      HOSTED_COMPOSE_RESULT: ${{ needs.hosted-compose.result }}
    steps:
      - name: Require every M10 lane
        run: |
          test "$CONTRACTS_RESULT" = success
          test "$HOSTED_COMPOSE_RESULT" = success
