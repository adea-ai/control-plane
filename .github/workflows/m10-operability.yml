name: M10 Operability

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m10-operability-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global bun@1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test:m10-conformance
      - run: bun run test:m10-operability

  hosted-compose:
    name: Hosted Compose
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Launch and disrupt supported Hosted profiles
        working-directory: infrastructure/compose
        shell: bash
        run: |
          set -euo pipefail

          compose_root="$RUNNER_TEMP/control-plane-m10-compose"
          install -d -m 700 \
            "$compose_root/simple" \
            "$compose_root/server/control-plane" \
            "$compose_root/server/postgres" \
            "$compose_root/server/restate"
          RESTATE_REQUEST_IDENTITY_PUBLIC_KEY="$(node ../../scripts/provision-restate-identity.mjs "$compose_root/server/restate")"
          export RESTATE_REQUEST_IDENTITY_PUBLIC_KEY
          sudo chown -R 1000:1000 "$compose_root/simple" "$compose_root/server/control-plane"
          sudo chown -R 70:70 "$compose_root/server/postgres"
          sudo chown -R 0:0 "$compose_root/server/restate"
          export CONTROL_PLANE_PORT=33300

          cleanup() {
            exit_code="$?"
            trap - EXIT
            if [[ "$exit_code" != 0 ]]; then
              docker compose --profile simple --profile server ps -a || true
              docker compose --profile simple --profile server logs --no-color || true
            fi
            docker compose --profile simple --profile server down || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          export CONTROL_PLANE_DATA_PATH="$compose_root/simple"
          docker compose --profile simple up --build -d
          for _ in {1..60}; do
            simple_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:33300/ready || true)"
            [[ "$simple_status" == 200 ]] && break
            sleep 2
          done
          test "$simple_status" = 200
          credential_before="$(docker compose exec -T control-plane-simple sha256sum /var/lib/control-plane/auth/local-api.token | cut -d ' ' -f 1)"
          docker compose --profile simple up -d --force-recreate
          for _ in {1..60}; do
            simple_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:33300/ready || true)"
            [[ "$simple_status" == 200 ]] && break
            sleep 2
          done
          test "$simple_status" = 200
          credential_after="$(docker compose exec -T control-plane-simple sha256sum /var/lib/control-plane/auth/local-api.token | cut -d ' ' -f 1)"
          test "$credential_before" = "$credential_after"
          docker compose --profile simple down

          POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          POSTGRES_MIGRATION_PASSWORD="$(openssl rand -hex 32)"
          POSTGRES_APPLICATION_PASSWORD="$(openssl rand -hex 32)"
          export POSTGRES_PASSWORD POSTGRES_MIGRATION_PASSWORD POSTGRES_APPLICATION_PASSWORD
          export CONTROL_PLANE_SERVER_DATA_PATH="$compose_root/server/control-plane"
          export POSTGRES_DATA_PATH="$compose_root/server/postgres"
          export RESTATE_DATA_PATH="$compose_root/server/restate"
          docker compose --profile server up -d --wait postgres
          docker compose exec -T postgres psql -U control_plane -d control_plane -v ON_ERROR_STOP=1 -c 'create table legacy_role_upgrade_probe(id integer primary key);'
          docker compose --profile server up --build -d
          for _ in {1..60}; do
            server_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:33300/ready || true)"
            [[ "$server_status" == 200 ]] && break
            sleep 2
          done
          test "$server_status" = 200

          expected_migrations="$(find ../../packages/database/drizzle -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          applied_migrations="$(docker compose exec -T postgres psql -U control_plane -d control_plane -Atc 'select count(*) from drizzle.__drizzle_migrations;')"
          test "$applied_migrations" = "$expected_migrations"
          test "$(docker compose exec -T -e PGPASSWORD="$POSTGRES_MIGRATION_PASSWORD" postgres psql -h 127.0.0.1 -U control_plane_migrator -d control_plane -Atc 'select current_user;')" = control_plane_migrator
          test "$(docker compose exec -T -e PGPASSWORD="$POSTGRES_APPLICATION_PASSWORD" postgres psql -h 127.0.0.1 -U control_plane_app -d control_plane -Atc 'select current_user;')" = control_plane_app
          test "$(docker compose exec -T postgres psql -U control_plane -d control_plane -Atc 'select rolsuper or rolcreatedb or rolcreaterole or rolbypassrls from pg_roles where rolname = $$control_plane_app$$;')" = f
          test "$(docker compose exec -T postgres psql -U control_plane -d control_plane -Atc 'select pg_get_userbyid(datdba) = $$control_plane_app$$ from pg_database where datname = $$control_plane$$;')" = f
          test "$(docker compose exec -T postgres psql -U control_plane -d control_plane -Atc 'select count(*) from pg_auth_members where member = (select oid from pg_roles where rolname = $$control_plane_app$$);')" = 0
          test "$(docker compose exec -T postgres psql -U control_plane -d control_plane -Atc 'select count(*) from information_schema.role_table_grants where grantee = $$control_plane_app$$ and privilege_type not in ($$SELECT$$, $$INSERT$$, $$UPDATE$$, $$DELETE$$);')" = 0
          test "$(docker compose exec -T postgres psql -U control_plane -d control_plane -Atc 'select tableowner from pg_tables where schemaname = $$public$$ and tablename = $$legacy_role_upgrade_probe$$;')" = control_plane_migrator
          test "$(docker compose exec -T -e PGPASSWORD="$POSTGRES_APPLICATION_PASSWORD" postgres psql -h 127.0.0.1 -U control_plane_app -d control_plane -v ON_ERROR_STOP=1 -qAtc 'begin; insert into legacy_role_upgrade_probe values (1); update legacy_role_upgrade_probe set id = 2 where id = 1; delete from legacy_role_upgrade_probe where id = 2; select count(*) from legacy_role_upgrade_probe; commit;')" = 0
          if docker compose exec -T -e PGPASSWORD="$POSTGRES_APPLICATION_PASSWORD" postgres psql -h 127.0.0.1 -U control_plane_app -d control_plane -v ON_ERROR_STOP=1 -c 'create table runtime_role_must_not_create_objects(id integer);'; then
            echo 'Application database role unexpectedly has DDL privileges.' >&2
            exit 1
          fi
          if docker compose run --rm --no-deps -e POSTGRES_APPLICATION_PASSWORD="$POSTGRES_MIGRATION_PASSWORD" database-bootstrap; then
            echo 'Database role bootstrap unexpectedly accepted duplicate passwords.' >&2
            exit 1
          fi

          docker compose stop restate
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:33300/ready)" = 503
          docker compose start restate
          for _ in {1..60}; do
            server_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:33300/ready || true)"
            [[ "$server_status" == 200 ]] && break
            sleep 2
          done
          test "$server_status" = 200

          docker compose stop postgres
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:33300/ready)" = 503
          docker compose start postgres
          for _ in {1..60}; do
            server_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:33300/ready || true)"
            [[ "$server_status" == 200 ]] && break
            sleep 2
          done
          test "$server_status" = 200

  gate:
    name: M10 Operability / Gate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [contracts, hosted-compose]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONTRACTS_RESULT: ${{ needs.contracts.result }}
      HOSTED_COMPOSE_RESULT: ${{ needs.hosted-compose.result }}
    steps:
      - name: Require every M10 lane
        run: |
          test "$CONTRACTS_RESULT" = success
          test "$HOSTED_COMPOSE_RESULT" = success
