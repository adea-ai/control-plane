name: Release token diagnostic (temporary)

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Probe the automation token against this repository
        env:
          TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN }}
        run: |
          set -euo pipefail
          echo "== GET repos/adea-ai/control-plane =="
          status=$(curl -s -o /tmp/get.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/adea-ai/control-plane)
          echo "status=$status"
          head -c 200 /tmp/get.json; echo
          echo "== GET the workspace release collection (read) =="
          status=$(curl -s -o /tmp/rel.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/adea-ai/control-plane/releases?per_page=1)
          echo "status=$status"
          echo "== POST create draft release (the failing call) =="
          status=$(curl -s -o /tmp/post.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/adea-ai/control-plane/releases \
            -d '{"tag_name":"zzz-token-diagnostic","name":"token diagnostic (deleted)","draft":true,"target_commitish":"main"}')
          echo "status=$status"
          head -c 500 /tmp/post.json; echo
          if [ "$status" = "201" ]; then
            id=$(node -e 'console.log(require("/tmp/post.json").id)')
            curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/repos/adea-ai/control-plane/releases/$id
            echo "cleanup: deleted probe release $id"
          fi
