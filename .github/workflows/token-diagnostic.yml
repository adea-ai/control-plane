name: Release token diagnostic (temporary)

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: release-please-shaped payloads
        env:
          TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN }}
        run: |
          set -euo pipefail
          try() { # tag suffix, extra json
            status=$(curl -s -o /tmp/pp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/adea-ai/control-plane/releases \
              -d '{"tag_name":"zzz-shape-'"$1"'","name":"probe","draft":false,"prerelease":true,"target_commitish":"main","generate_release_notes":'"$2"'}')
            echo "variant $1 (grn=$2): status=$status $(head -c 120 /tmp/pp.json)"
            if [ "$status" = "201" ]; then
              id=$(node -e 'console.log(require("/tmp/pp.json").id)')
              curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/adea-ai/control-plane/releases/${id}"
              curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/adea-ai/control-plane/git/refs/tags/zzz-shape-${1}" || true
            fi
          }
          try grn-true true
          try grn-false false
          body=$(printf '{"tag_name":"zzz-shape-body","name":"1.71.4","draft":false,"body":"## [1.71.4](https://github.com/adea-ai/control-plane/compare/workspace-v1.71.3...workspace-v1.71.4) (2026-10-05)\\n\\n### Bug Fixes\\n\\n* something ([#123](https://github.com/adea-ai/control-plane/issues/123)) ([abc1234](https://github.com/adea-ai/control-plane/commit/abc1234def4567890123456789012345678901234))\\n"}')
          status=$(curl -s -o /tmp/p3.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/adea-ai/control-plane/releases -d "$body")
          echo "variant body: status=$status $(head -c 120 /tmp/p3.json)"
          if [ "$status" = "201" ]; then
            id=$(node -e 'console.log(require("/tmp/p3.json").id)')
            curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/adea-ai/control-plane/releases/${id}"
            curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/adea-ai/control-plane/git/refs/tags/zzz-shape-body || true
          fi
