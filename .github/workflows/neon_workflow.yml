name: Verify trusted-main Neon database migrations

on:
  push:
    branches:
      - main

permissions: {}

# One verification per main at a time: the previous group embedded
# github.run_id, which made the group unique per run and let concurrent main
# pushes run overlapping 90-minute Neon verifications against the same
# project. A newer main supersedes the verification of the older one.
concurrency:
  group: neon-main-preview
  cancel-in-progress: true

jobs:
  verify_neon_preview:
    name: Verify migrations and PostgreSQL profile conformance
    runs-on: ubuntu-latest
    # Each case keeps an independent database. Remote migration setup alone
    # takes about 30 seconds per database; preserve that isolation and allow
    # the expanded integration suite to complete with streamed progress.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # Only the protected main push gets Neon credentials. Pull-request
      # coverage runs separately against disposable local PostgreSQL.
      - name: Check Neon preview credentials
        id: credentials
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          DATABASE_APP_PASSWORD: ${{ secrets.NEON_CI_APP_PASSWORD }}
          DATABASE_MIGRATION_PASSWORD: ${{ secrets.NEON_CI_MIGRATION_PASSWORD }}
          DATABASE_ADMIN_PASSWORD: ${{ secrets.NEON_CI_ADMIN_PASSWORD }}
        run: |
          if [ -n "$NEON_API_KEY" ] &&
             [ -n "$NEON_PROJECT_ID" ] &&
             [ -n "$DATABASE_APP_PASSWORD" ] &&
             [ -n "$DATABASE_MIGRATION_PASSWORD" ] &&
             [ -n "$DATABASE_ADMIN_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Neon preview skipped::Neon project, API key, and all three least-privilege database credentials are required; skipping ephemeral Neon testing."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Name this run's disposable branch
        if: steps.credentials.outputs.available == 'true'
        id: preview_branch
        run: echo "name=preview/main-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set disposable branch expiration
        if: steps.credentials.outputs.available == 'true'
        run: echo "EXPIRES_AT=$(date -u --date '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon branch
        if: steps.credentials.outputs.available == 'true'
        id: create_neon_branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.preview_branch.outputs.name }}
          parent_branch: staging
          database: neondb
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Checkout trusted main source
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        if: steps.credentials.outputs.available == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.credentials.outputs.available == 'true'
        run: bun run build

      - name: Build restricted database URLs
        if: steps.credentials.outputs.available == 'true'
        env:
          DATABASE_HOST: ${{ steps.create_neon_branch.outputs.db_host }}
          DATABASE_HOST_POOLED: ${{ steps.create_neon_branch.outputs.db_host_pooled }}
          DATABASE_APP_PASSWORD: ${{ secrets.NEON_CI_APP_PASSWORD }}
          DATABASE_MIGRATION_PASSWORD: ${{ secrets.NEON_CI_MIGRATION_PASSWORD }}
          DATABASE_ADMIN_PASSWORD: ${{ secrets.NEON_CI_ADMIN_PASSWORD }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const {
            DATABASE_APP_PASSWORD,
            DATABASE_HOST,
            DATABASE_HOST_POOLED,
            DATABASE_ADMIN_PASSWORD,
            DATABASE_MIGRATION_PASSWORD,
            GITHUB_ENV,
          } = process.env;
          if (
            !DATABASE_APP_PASSWORD ||
            !DATABASE_HOST ||
            !DATABASE_HOST_POOLED ||
            !DATABASE_MIGRATION_PASSWORD ||
            !DATABASE_ADMIN_PASSWORD ||
            !GITHUB_ENV
          ) {
            throw new Error("Neon migration connection inputs are unavailable");
          }
          const connectionUrl = (role, password, host, database = "neondb") => {
            const url = new URL("postgresql://" + role + "@localhost/" + database);
            url.hostname = host;
            url.password = password;
            url.searchParams.set("sslmode", "require");
            return url.toString();
          };
          const runtimeUrl = connectionUrl(
            "control_plane_app",
            DATABASE_APP_PASSWORD,
            DATABASE_HOST_POOLED,
          );
          const runtimeUnpooledUrl = connectionUrl(
            "control_plane_app",
            DATABASE_APP_PASSWORD,
            DATABASE_HOST,
          );
          const migrationUrl = connectionUrl(
            "control_plane_migrator",
            DATABASE_MIGRATION_PASSWORD,
            DATABASE_HOST,
          );
          const adminUrl = connectionUrl(
            "control_plane_admin",
            DATABASE_ADMIN_PASSWORD,
            DATABASE_HOST,
            "postgres",
          );
          console.log("::add-mask::" + runtimeUrl);
          console.log("::add-mask::" + runtimeUnpooledUrl);
          console.log("::add-mask::" + migrationUrl);
          console.log("::add-mask::" + adminUrl);
          appendFileSync(
            GITHUB_ENV,
            "DATABASE_URL=" + runtimeUrl + "\n" +
              "DATABASE_URL_UNPOOLED=" + runtimeUnpooledUrl + "\n" +
              "DATABASE_MIGRATION_URL=" + migrationUrl + "\n" +
              "DATABASE_ADMIN_URL=" + adminUrl + "\n",
          );
          NODE

      - name: Prepare isolated preview database ownership
        if: steps.credentials.outputs.available == 'true'
        working-directory: packages/database
        env:
          DATABASE_ADMIN_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          PREVIEW_DATABASE_HOST: ${{ steps.create_neon_branch.outputs.db_host }}
        run: |
          bun -e '
          import postgres from "postgres";
          const url = new URL(process.env.DATABASE_ADMIN_URL);
          if (!process.env.PREVIEW_DATABASE_HOST ||
              url.hostname !== process.env.PREVIEW_DATABASE_HOST ||
              url.username !== "neondb_owner") throw new Error("INVALID_PREVIEW_ADMIN_TARGET");
          const sql = postgres(url.toString(), { max: 1 });
          try {
            await sql.unsafe("GRANT control_plane_migrator TO neondb_owner WITH SET TRUE");
          } finally { await sql.end(); }
          '

      - name: Verify cross-profile conformance matrix (Postgres)
        if: steps.credentials.outputs.available == 'true'
        env:
          RUN_M10_POSTGRES_CONFORMANCE: 'true'
        run: |
          bun test tests/cp1-embedded-durable-execution.test.mjs

      - name: Verify migrations and transactions
        if: steps.credentials.outputs.available == 'true'
        run: |
          bun --cwd=packages/database run db:check
          bun --cwd=packages/database run db:migrate
          bun run test:integration

      - name: Find exact preview branch for cleanup
        if: always() && steps.create_neon_branch.outcome == 'success'
        id: cleanup_branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          DATABASE_URL: ''
          DATABASE_URL_UNPOOLED: ''
          DATABASE_MIGRATION_URL: ''
          DATABASE_ADMIN_URL: ''
        run: |
          node <<'CLEANUP'
          const { appendFileSync } = require('node:fs');
          (async () => {
            const {
              NEON_API_KEY,
              NEON_PROJECT_ID,
              GITHUB_RUN_ID,
              GITHUB_RUN_ATTEMPT,
              GITHUB_OUTPUT,
            } = process.env;
            if (
              !NEON_API_KEY || !GITHUB_OUTPUT ||
              !/^[a-z0-9-]{1,60}$/.test(NEON_PROJECT_ID ?? '') ||
              !/^[1-9][0-9]*$/.test(GITHUB_RUN_ID ?? '') ||
              !/^[1-9][0-9]*$/.test(GITHUB_RUN_ATTEMPT ?? '')
            ) throw new Error('Neon cleanup inputs are unavailable or invalid');
            const targetName = "preview/main-" + GITHUB_RUN_ID + "-" + GITHUB_RUN_ATTEMPT;
            const cursors = new Set();
            let cursor;
            let target;
            for (let page = 0; page < 20; page += 1) {
              const url = new URL('https://console.neon.tech/api/v2/projects/' + NEON_PROJECT_ID + '/branches');
              url.searchParams.set('search', targetName);
              url.searchParams.set('limit', '1000');
              if (cursor) url.searchParams.set('cursor', cursor);
              const response = await fetch(url, {
                headers: { Authorization: 'Bearer ' + NEON_API_KEY },
                redirect: 'error',
                signal: AbortSignal.timeout(10000),
              });
              if (response.status !== 200) throw new Error('Neon cleanup lookup failed: HTTP ' + response.status);
              const result = await response.json();
              if (!Array.isArray(result?.branches)) throw new Error('Invalid Neon branch listing');
              for (const branch of result.branches) {
                if (!branch || typeof branch.name !== 'string') throw new Error('Invalid Neon branch entry');
                if (branch.name !== targetName) continue;
                if (
                  target || !/^br-[a-z0-9-]{1,57}$/.test(branch.id ?? '') ||
                  branch.project_id !== NEON_PROJECT_ID || !/^br-[a-z0-9-]{1,57}$/.test(branch.parent_id ?? '') ||
                  branch.primary !== false || branch.default !== false || branch.protected !== false
                ) throw new Error('Unsafe or ambiguous Neon cleanup target');
                target = branch.id;
              }
              if (result.pagination !== undefined && (
                result.pagination === null || typeof result.pagination !== 'object' || Array.isArray(result.pagination)
              )) throw new Error('Invalid Neon branch pagination');
              const next = result.pagination?.next;
              if (next === undefined || next === null || next === '') {
                if (target) appendFileSync(GITHUB_OUTPUT, 'branch_id=' + target + "\n");
                else console.log('No matching preview branch exists; cleanup is already satisfied.');
                return;
              }
              if (typeof next !== 'string' || cursors.has(next)) throw new Error('Invalid Neon branch pagination');
              cursors.add(next);
              cursor = next;
            }
            throw new Error('Neon branch lookup exceeded pagination limit');
          })();
          CLEANUP

      - name: Delete Neon branch
        if: always() && steps.cleanup_branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        env:
          DATABASE_URL: ''
          DATABASE_URL_UNPOOLED: ''
          DATABASE_MIGRATION_URL: ''
          DATABASE_ADMIN_URL: ''
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.cleanup_branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
