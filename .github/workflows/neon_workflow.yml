name: Verify trusted-main Neon database migrations

# Cleanup uses the default-branch workflow; caller data never selects its source.
on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [neon-preview-cleanup]

permissions: {}

# Queue main verification so newer pushes cannot interrupt owned branch teardown.
# Completed-run cleanup has its own group and cannot replace pending main runs.
concurrency:
  group: ${{ github.event_name == 'push' && 'neon-main-preview' || 'neon-completed-preview-cleanup' }}
  cancel-in-progress: false

jobs:
  # Migration-relevance gate. A successful baseline is required before any
  # skip. A baseline counts only if the actual migration and integration
  # steps succeeded on all shards; version-only changes are checked directly.
  changes:
    if: github.event_name == 'push'
    name: Classify migration relevance
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      verify: ${{ steps.classify.outputs.verify }}
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify migration relevance
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node .github/scripts/neon-migration-gate.mjs

  verify_neon_preview:
    name: Verify Neon shard ${{ matrix.shard }} (migrations and integration slice)
    needs: [changes]
    if: >-
      github.event_name == 'push' && !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.verify != 'false')
    runs-on: ubuntu-latest
    # Each case keeps an independent database. Remote migration setup alone
    # takes about 30 seconds per database; preserve that isolation and allow
    # the expanded integration suite to complete with streamed progress.
    #
    # The suite is partitioned by scripts/integration-shards.mjs from measured
    # per-file durations, and every shard provisions its own disposable branch
    # so shards never share a Neon compute instance (the #146 contention fix
    # only ever required serializing work that shares one database). Shard 1
    # additionally carries the cross-profile conformance matrix and the cloud
    # remote drill; the former 2,327s serial chain collapses to the largest
    # shard's slice.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # Only the protected main push gets Neon credentials. Pull-request
      # coverage runs separately against disposable local PostgreSQL.
      - name: Check Neon preview credentials
        id: credentials
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          DATABASE_APP_PASSWORD: ${{ secrets.NEON_CI_APP_PASSWORD }}
          DATABASE_MIGRATION_PASSWORD: ${{ secrets.NEON_CI_MIGRATION_PASSWORD }}
          DATABASE_ADMIN_PASSWORD: ${{ secrets.NEON_CI_ADMIN_PASSWORD }}
        run: |
          if [ -n "$NEON_API_KEY" ] &&
             [ -n "$NEON_PROJECT_ID" ] &&
             [ -n "$DATABASE_APP_PASSWORD" ] &&
             [ -n "$DATABASE_MIGRATION_PASSWORD" ] &&
             [ -n "$DATABASE_ADMIN_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Neon preview skipped::Neon project, API key, and all three least-privilege database credentials are required; skipping ephemeral Neon testing."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Name this run's disposable branch
        if: steps.credentials.outputs.available == 'true'
        id: preview_branch
        run: echo "name=preview/main-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-s${{ matrix.shard }}" >> "$GITHUB_OUTPUT"

      - name: Set disposable branch expiration
        if: steps.credentials.outputs.available == 'true'
        run: echo "EXPIRES_AT=$(date -u --date '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon branch
        if: steps.credentials.outputs.available == 'true'
        id: create_neon_branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.preview_branch.outputs.name }}
          parent_branch: staging
          database: neondb
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Checkout trusted main source
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        if: steps.credentials.outputs.available == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.credentials.outputs.available == 'true'
        run: bun run build

      - name: Build restricted database URLs
        if: steps.credentials.outputs.available == 'true'
        env:
          DATABASE_HOST: ${{ steps.create_neon_branch.outputs.db_host }}
          DATABASE_HOST_POOLED: ${{ steps.create_neon_branch.outputs.db_host_pooled }}
          DATABASE_APP_PASSWORD: ${{ secrets.NEON_CI_APP_PASSWORD }}
          DATABASE_MIGRATION_PASSWORD: ${{ secrets.NEON_CI_MIGRATION_PASSWORD }}
          DATABASE_ADMIN_PASSWORD: ${{ secrets.NEON_CI_ADMIN_PASSWORD }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const {
            DATABASE_APP_PASSWORD,
            DATABASE_HOST,
            DATABASE_HOST_POOLED,
            DATABASE_ADMIN_PASSWORD,
            DATABASE_MIGRATION_PASSWORD,
            GITHUB_ENV,
          } = process.env;
          if (
            !DATABASE_APP_PASSWORD ||
            !DATABASE_HOST ||
            !DATABASE_HOST_POOLED ||
            !DATABASE_MIGRATION_PASSWORD ||
            !DATABASE_ADMIN_PASSWORD ||
            !GITHUB_ENV
          ) {
            throw new Error("Neon migration connection inputs are unavailable");
          }
          const connectionUrl = (role, password, host, database = "neondb") => {
            const url = new URL("postgresql://" + role + "@localhost/" + database);
            url.hostname = host;
            url.password = password;
            url.searchParams.set("sslmode", "require");
            return url.toString();
          };
          const runtimeUrl = connectionUrl(
            "control_plane_app",
            DATABASE_APP_PASSWORD,
            DATABASE_HOST_POOLED,
          );
          const runtimeUnpooledUrl = connectionUrl(
            "control_plane_app",
            DATABASE_APP_PASSWORD,
            DATABASE_HOST,
          );
          const migrationUrl = connectionUrl(
            "control_plane_migrator",
            DATABASE_MIGRATION_PASSWORD,
            DATABASE_HOST,
          );
          const adminUrl = connectionUrl(
            "control_plane_admin",
            DATABASE_ADMIN_PASSWORD,
            DATABASE_HOST,
            "postgres",
          );
          console.log("::add-mask::" + runtimeUrl);
          console.log("::add-mask::" + runtimeUnpooledUrl);
          console.log("::add-mask::" + migrationUrl);
          console.log("::add-mask::" + adminUrl);
          appendFileSync(
            GITHUB_ENV,
            "DATABASE_URL=" + runtimeUrl + "\n" +
              "DATABASE_URL_UNPOOLED=" + runtimeUnpooledUrl + "\n" +
              "DATABASE_MIGRATION_URL=" + migrationUrl + "\n" +
              "DATABASE_ADMIN_URL=" + adminUrl + "\n",
          );
          NODE

      - name: Prepare isolated preview database ownership
        if: steps.credentials.outputs.available == 'true'
        working-directory: packages/database
        env:
          DATABASE_ADMIN_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          PREVIEW_DATABASE_HOST: ${{ steps.create_neon_branch.outputs.db_host }}
        run: |
          bun -e '
          import postgres from "postgres";
          const url = new URL(process.env.DATABASE_ADMIN_URL);
          if (!process.env.PREVIEW_DATABASE_HOST ||
              url.hostname !== process.env.PREVIEW_DATABASE_HOST ||
              url.username !== "neondb_owner") throw new Error("INVALID_PREVIEW_ADMIN_TARGET");
          const sql = postgres(url.toString(), { max: 1 });
          try {
            await sql.unsafe("GRANT control_plane_migrator TO neondb_owner WITH SET TRUE");
          } finally { await sql.end(); }
          '

      - name: Verify cross-profile conformance matrix (Postgres)
        if: steps.credentials.outputs.available == 'true' && matrix.shard == 1
        env:
          RUN_M10_POSTGRES_CONFORMANCE: 'true'
        run: |
          bun test tests/cp1-embedded-durable-execution.test.mjs

      - name: Verify migrations and this shard's integration slice
        if: steps.credentials.outputs.available == 'true'
        # The runner already retries each remote file once in a fresh process.
        # A later drill failure must not repeat a successful database slice.
        run: |
          bun --cwd=packages/database run db:check
          bun --cwd=packages/database run db:migrate
          bun scripts/run-integration-tests.mjs --shard=${{ matrix.shard }}

      - name: Verify Hosted PostgreSQL and Restate graph
        if: steps.credentials.outputs.available == 'true' && matrix.shard == 3
        # Reuse this shard's preview and the supported Compose Restate pin.
        # The script requires one passing scenario, rejects skips, and removes
        # only its owned container and identity fixture even after failed start.
        run: bash scripts/run-hosted-graph-qualification.sh

      - name: Find exact preview branch for cleanup
        if: always() && steps.preview_branch.outputs.name != ''
        id: cleanup_branch
        timeout-minutes: 12
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          SHARD: ${{ matrix.shard }}
          NEON_CREATE_OUTCOME: ${{ steps.create_neon_branch.outcome }}
          DATABASE_URL: ''
          DATABASE_URL_UNPOOLED: ''
          DATABASE_MIGRATION_URL: ''
          DATABASE_ADMIN_URL: ''
        run: &find_owned_preview_branch |
          node <<'CLEANUP'
          const { appendFileSync } = require('node:fs');
          (async () => {
          const {
            NEON_API_KEY,
            NEON_PROJECT_ID,
            SHARD,
            GITHUB_RUN_ID,
            GITHUB_RUN_ATTEMPT,
            GITHUB_OUTPUT,
            NEON_CREATE_OUTCOME,
            NEON_CLEANUP_MODE,
            NEON_CLEANUP_RUN_ID,
            NEON_CLEANUP_RUN_ATTEMPT,
            NEON_CLEANUP_HEAD_SHA,
            GH_TOKEN,
            GITHUB_REPOSITORY,
          } = process.env;
          const manual = NEON_CLEANUP_MODE === 'completed-run' ||
            [NEON_CLEANUP_RUN_ID, NEON_CLEANUP_RUN_ATTEMPT, NEON_CLEANUP_HEAD_SHA]
            .some((value) => value !== undefined && value !== '');
          const targetRunId = manual ? NEON_CLEANUP_RUN_ID : GITHUB_RUN_ID;
          const targetAttempt = manual ? NEON_CLEANUP_RUN_ATTEMPT : GITHUB_RUN_ATTEMPT;
          if (
            !NEON_API_KEY || !GITHUB_OUTPUT ||
            !/^[a-z0-9-]{1,60}$/.test(NEON_PROJECT_ID ?? '') ||
            !/^[123]$/.test(SHARD ?? '') ||
            !/^[1-9][0-9]*$/.test(targetRunId ?? '') ||
            !/^[1-9][0-9]*$/.test(targetAttempt ?? '')
          ) throw new Error('Neon cleanup inputs are unavailable or invalid');
          let creationOutcome = NEON_CREATE_OUTCOME;
          if (manual) {
            if (!GH_TOKEN || !/^[a-f0-9]{40}$/.test(NEON_CLEANUP_HEAD_SHA ?? '') ||
                !/^[a-zA-Z0-9_.-]+\/[a-zA-Z0-9_.-]+$/.test(GITHUB_REPOSITORY ?? ''))
              throw new Error('Invalid Neon cleanup owner inputs');
            const requestOwner = async (suffix) => {
              let response;
              try {
                response = await fetch('https://api.github.com/repos/' + GITHUB_REPOSITORY + suffix, {
                  headers: { Authorization: 'Bearer ' + GH_TOKEN, Accept: 'application/vnd.github+json' },
                  redirect: 'error', signal: AbortSignal.timeout(10000),
                });
                if (response.status !== 200) throw new Error();
                return await response.json();
              } catch { throw new Error('Neon cleanup owner lookup failed'); }
            };
            const owner = await requestOwner('/actions/runs/' + targetRunId);
            if (String(owner?.id) !== targetRunId || String(owner.run_attempt) !== targetAttempt ||
                owner.event !== 'push' || owner.head_branch !== 'main' ||
                owner.head_sha !== NEON_CLEANUP_HEAD_SHA || owner.status !== 'completed' ||
                owner.path !== '.github/workflows/neon_workflow.yml' ||
                owner.repository?.full_name !== GITHUB_REPOSITORY)
              throw new Error('Neon cleanup owner is not the recorded completed trusted-main run');
            const result = await requestOwner('/actions/runs/' + targetRunId + '/attempts/' + targetAttempt + '/jobs?per_page=100');
            if (!Array.isArray(result?.jobs) || result.total_count !== result.jobs.length || result.total_count > 100)
              throw new Error('Neon cleanup owner jobs are incomplete');
            const jobs = result.jobs.filter((job) => job.name === 'Verify Neon shard ' + SHARD + ' (migrations and integration slice)');
            const creators = jobs[0]?.steps?.filter((step) => step.name === 'Create Neon branch');
            if (jobs.length !== 1 || jobs[0].status !== 'completed' ||
                !Array.isArray(creators) || creators.length !== 1 || creators[0].status !== 'completed')
              throw new Error('Neon cleanup creator is not terminal and unique');
            creationOutcome = creators[0].conclusion;
          }
          const targetName = "preview/main-" + targetRunId + "-" + targetAttempt + "-s" + SHARD;
            const cursors = new Set();
            let cursor;
            let target;
            for (let page = 0; page < 20; page += 1) {
              const url = new URL('https://console.neon.tech/api/v2/projects/' + NEON_PROJECT_ID + '/branches');
              url.searchParams.set('search', targetName);
              url.searchParams.set('limit', '1000');
              if (cursor) url.searchParams.set('cursor', cursor);
              let response;
              let result;
              for (let attempt = 0; attempt < 3; attempt += 1) {
                try {
                  response = await fetch(url, {
                    headers: { Authorization: 'Bearer ' + NEON_API_KEY },
                    redirect: 'error',
                    signal: AbortSignal.timeout(10000),
                  });
                } catch {
                  response = undefined;
                }
                if (response?.status === 200) {
                  try {
                    result = await response.json();
                    break;
                  } catch (error) {
                    if (error?.name === 'SyntaxError') throw new Error('Invalid Neon branch listing');
                    response = undefined;
                  }
                }
                const retryable = !response || [408, 429, 500, 502, 503, 504].includes(response.status);
                if (!retryable || attempt === 2) {
                  throw new Error('Neon cleanup lookup failed: ' + (response ? 'HTTP ' + response.status : 'transport error'));
                }
                if (response?.body) await response.body.cancel().catch(() => {});
                await new Promise((resolve) => setTimeout(resolve, 500 * (attempt + 1)));
              }
              if (!Array.isArray(result?.branches)) throw new Error('Invalid Neon branch listing');
              for (const branch of result.branches) {
                if (!branch || typeof branch.name !== 'string') throw new Error('Invalid Neon branch entry');
                if (branch.name !== targetName) continue;
                if (
                  target || !/^br-[a-z0-9-]{1,57}$/.test(branch.id ?? '') ||
                  branch.project_id !== NEON_PROJECT_ID || !/^br-[a-z0-9-]{1,57}$/.test(branch.parent_id ?? '') ||
                  branch.primary !== false || branch.default !== false || branch.protected !== false
                ) throw new Error('Unsafe or ambiguous Neon cleanup target');
                target = branch.id;
              }
              if (result.pagination !== undefined && (
                result.pagination === null || typeof result.pagination !== 'object' || Array.isArray(result.pagination)
              )) throw new Error('Invalid Neon branch pagination');
              const next = result.pagination?.next;
              if (next === undefined || next === null || next === '') {
                if (target) appendFileSync(GITHUB_OUTPUT, 'branch_id=' + target + "\n");
                else if (!manual && !['success', 'skipped'].includes(creationOutcome))
                  throw new Error('Neon creation outcome is unconfirmed; no matching preview observed');
                else console.log(manual && creationOutcome !== 'success'
                  ? 'No matching preview observed after terminal creator; original creation acknowledgement remains unknown.'
                  : 'No matching preview branch exists; cleanup is already satisfied.');
                return;
              }
              if (typeof next !== 'string' || cursors.has(next)) throw new Error('Invalid Neon branch pagination');
              cursors.add(next);
              cursor = next;
            }
            throw new Error('Neon branch lookup exceeded pagination limit');
          })();
          CLEANUP

      - name: Delete Neon branch
        if: always() && steps.cleanup_branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        env:
          DATABASE_URL: ''
          DATABASE_URL_UNPOOLED: ''
          DATABASE_MIGRATION_URL: ''
          DATABASE_ADMIN_URL: ''
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.cleanup_branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Verify Neon branch absence
        if: always() && steps.cleanup_branch.outputs.branch_id != ''
        timeout-minutes: 2
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          TARGET_BRANCH_ID: ${{ steps.cleanup_branch.outputs.branch_id }}
          DATABASE_URL: ''
          DATABASE_URL_UNPOOLED: ''
          DATABASE_MIGRATION_URL: ''
          DATABASE_ADMIN_URL: ''
        run: &verify_owned_preview_absence |
          node <<'VERIFY'
          (async () => {
            const { NEON_API_KEY, NEON_PROJECT_ID, TARGET_BRANCH_ID } = process.env;
            if (!NEON_API_KEY || !/^[a-z0-9-]{1,60}$/.test(NEON_PROJECT_ID ?? '') ||
                !/^br-[a-z0-9-]{1,57}$/.test(TARGET_BRANCH_ID ?? ''))
              throw new Error('Invalid Neon deletion verification inputs');
            const url = 'https://console.neon.tech/api/v2/projects/' + NEON_PROJECT_ID + '/branches/' + TARGET_BRANCH_ID;
            for (let attempt = 0; attempt < 3; attempt += 1) {
              let response;
              try { response = await fetch(url, {
                headers: { Authorization: 'Bearer ' + NEON_API_KEY },
                redirect: 'error', signal: AbortSignal.timeout(10000),
              }); } catch { response = undefined; }
              if (response?.status === 404) {
                console.log('Verified preview branch metadata is absent: ' + TARGET_BRANCH_ID);
                return;
              }
              const retryable = !response || [200, 408, 423, 429, 500, 502, 503, 504].includes(response.status);
              if (response?.body) await response.body.cancel().catch(() => {});
              if (!retryable || attempt === 2) throw new Error('Neon branch deletion is not confirmed');
              await new Promise((resolve) => setTimeout(resolve, 500 * (attempt + 1)));
            }
          })();
          VERIFY

  cleanup_completed_preview:
    name: Reconcile one completed run's Neon preview
    if: github.event_name == 'repository_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 16
    permissions:
      actions: read
    steps:
      - name: Find exact preview branch for cleanup
        id: cleanup_branch
        timeout-minutes: 12
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEON_CLEANUP_MODE: completed-run
          NEON_CLEANUP_RUN_ID: ${{ github.event.client_payload.cleanup_run_id }}
          NEON_CLEANUP_RUN_ATTEMPT: ${{ github.event.client_payload.cleanup_run_attempt }}
          NEON_CLEANUP_HEAD_SHA: ${{ github.event.client_payload.cleanup_head_sha }}
          SHARD: ${{ github.event.client_payload.cleanup_shard }}
          DATABASE_URL: ''
          DATABASE_URL_UNPOOLED: ''
          DATABASE_MIGRATION_URL: ''
          DATABASE_ADMIN_URL: ''
        run: *find_owned_preview_branch
      - name: Delete Neon branch
        if: always() && steps.cleanup_branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        env:
          DATABASE_URL: ''
          DATABASE_URL_UNPOOLED: ''
          DATABASE_MIGRATION_URL: ''
          DATABASE_ADMIN_URL: ''
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.cleanup_branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Verify Neon branch absence
        if: always() && steps.cleanup_branch.outputs.branch_id != ''
        timeout-minutes: 2
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          TARGET_BRANCH_ID: ${{ steps.cleanup_branch.outputs.branch_id }}
          DATABASE_URL: ''
          DATABASE_URL_UNPOOLED: ''
          DATABASE_MIGRATION_URL: ''
          DATABASE_ADMIN_URL: ''
        run: *verify_owned_preview_absence
