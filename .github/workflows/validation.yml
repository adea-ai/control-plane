name: Code Foundry Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - ready_for_review
      - synchronize

# Default every caller job to no repository permissions. Individual jobs grant
# only the scopes their own validation path consumes.
permissions: {}

# Superseded PR updates cancel the previous run.
concurrency:
  group: code-foundry-validation-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  # Superseded pull-request runs are cancelled so the newest head owns the
  # group; push and scheduled runs queue instead, because cancelling a main
  # push can drop default-branch analysis or release-adjacent work.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mode:
    name: Mode
    # The mode classifier is only needed for ready pull requests. Main pushes
    # use the dedicated default-branch CodeQL lane below; draft updates do not
    # allocate a validation runner.
    if: vars.CI_BILLING_PAUSED != 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      # The runtime classifies policy from the consumer repository's config.
      # Keep this checkout before the isolated runtime checkout below.
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: 0xPlayerOne/code-foundry
          ref: v1.48.4
          path: .github/.code-foundry
          sparse-checkout: |
            src/lib
            src/runtime-core.mjs
            src/runtime.mjs
      - name: Install runtime
        run: mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
      - name: Classify validation mode
        id: classify
        env:
          FOUNDRY_EVENT_NAME: ${{ github.event_name }}
          FOUNDRY_BASE_REF: ${{ github.event.pull_request.base.ref }}
          FOUNDRY_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node "$RUNNER_TEMP/code-foundry/src/runtime.mjs" validation mode >> "$GITHUB_OUTPUT"

  # The original Code Foundry gate is retained as a runtime dependency; the
  # explicit local aggregate below preserves the ruleset's stable check name.
  validation_runtime:
    name: Code Foundry runtime
    needs: mode
    # Bot-authored pull requests (Dependabot and friends) validate only on an
    # explicit ready transition: dependency pushes never allocate validation
    # runners by themselves. A human pushing to a bot branch also runs, since
    # the sender is no longer a bot. Release Please heads are managed by the
    # release workflow and always validate.
    if: vars.CI_BILLING_PAUSED != 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.pull_request.user.type != 'Bot' || github.event.sender.type != 'Bot' || startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
    # Reusable workflows can only maintain or reduce the caller job's scopes.
    # The audit tier needs security-events: write for CodeQL uploads.
    permissions:
      actions: read
      contents: read
      issues: read
      packages: read
      security-events: write
    uses: 0xPlayerOne/code-foundry/.github/workflows/validation.yml@v1.48.4
    with:
      mode: ${{ needs.mode.outputs.mode }}
      runtime-repository: 0xPlayerOne/code-foundry
      # Pull requests validate the proposed runtime commit. Scheduled and
      # manually dispatched audits use a separate default-branch-pinned caller,
      # so this caller-selected ref never runs with default-branch cache access.
      runtime-ref: v1.48.4
      ci-runner: ubuntu-latest
      test-runner: ubuntu-latest
      unit-runner: ubuntu-latest
      performance-runner: ubuntu-latest
      security-runner: ubuntu-slim
      eval-runner: ubuntu-slim
      codeql-runner: ubuntu-latest
      rust-shards: '["all"]'
      rust-threads: '1'
      rust-max-parallel: 1
      # The sync renderer rewrites both values from the e2e_shards config key;
      # the defaults keep repositories without that key on one unsharded job.
      # The E2E lane is one sequential job, so its wall clock is the sum of
      # every file: run 39346283807 measured 128.7s on a runner that was 1.55x
      # slower than the main run, over the 120s ceiling. Two shards keep every
      # file, every test and the same ceiling while the lane's wall clock
      # becomes the slower shard. Both inputs are strings in the pinned
      # Code Foundry workflow, so both values are quoted.
      e2e-shard-list: '1,2'
      e2e-total-shards: '2'
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

  postgres_qualification:
    name: PostgreSQL qualification
    needs: mode
    if: >-
      vars.CI_BILLING_PAUSED != 'true' && github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (github.event.pull_request.user.type != 'Bot' || github.event.sender.type != 'Bot' ||
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
    permissions:
      contents: read
    uses: ./.github/workflows/postgres-pull-request.yml

  # Keep the required ruleset context (Validation / Gate) and fail closed if
  # either the reusable validation runtime or strict PostgreSQL qualification
  # fails, is skipped, or cannot report a result.
  # Keep the canonical `validation` job ID for Code Foundry doctor. The local
  # aggregate owns the complete check name instead of relying on nesting.
  validation:
    name: Validation / Gate
    needs: [mode, validation_runtime, postgres_qualification]
    if: >-
      always() && vars.CI_BILLING_PAUSED != 'true' &&
      github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      (github.event.pull_request.user.type != 'Bot' || github.event.sender.type != 'Bot' ||
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Require every validation lane to succeed
        env:
          MODE_RESULT: ${{ needs.mode.result }}
          VALIDATION_RESULT: ${{ needs.validation_runtime.result }}
          POSTGRES_RESULT: ${{ needs.postgres_qualification.result }}
        run: |
          if [[ "$MODE_RESULT" != success || "$VALIDATION_RESULT" != success || "$POSTGRES_RESULT" != success ]]; then
            echo "Validation gate failed closed (mode=$MODE_RESULT validation=$VALIDATION_RESULT postgres=$POSTGRES_RESULT)." >&2
            exit 1
          fi

  # CodeQL requires a push analysis to populate default-branch code-scanning
  # alerts. Keep the full validation gate pull-request-only so main pushes do
  # not duplicate CI, test, or security work. Release Please version merges
  # change manifests only, so the code tree is identical to the content merge
  # whose default-branch scan is still current; re-scanning it on every release
  # wastes the Rust-heavy analysis budget, and the scheduled audit covers drift.
  default-branch-codeql:
    name: CodeQL (default branch)
    if: >-
      vars.CI_BILLING_PAUSED != 'true' && github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore(main): release ')
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: 0xPlayerOne/code-foundry/.github/workflows/codeql.yml@v1.48.4
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: v1.48.4
      runner: ubuntu-latest
      rust-shards: '["all"]'
      rust-threads: '1'
      rust-max-parallel: 1
