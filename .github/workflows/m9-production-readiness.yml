name: M9 Production Readiness

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '17 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m9-production-readiness-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    name: Core hardening
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global bun@1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run type-check
      - run: bun run test:unit
      - run: bun run test:isolation-matrix
      - run: bun run test:secret-canaries
      - name: Run hardening and load evidence
        shell: bash
        run: |
          mkdir -p m11-evidence
          set -o pipefail
          bun run test:m9-acceptance | tee m11-evidence/load.jsonl
      - name: Retain load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m11-load-${{ github.sha }}
          path: m11-evidence/load.jsonl
          if-no-files-found: error
          retention-days: 30
      - run: bun audit

  integration-recovery:
    name: Integration and recovery
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global bun@1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run recovery evidence
        shell: bash
        run: |
          mkdir -p m11-evidence
          set -o pipefail
          bun run test:recovery-matrix | tee m11-evidence/recovery.log
      - name: Retain recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m11-recovery-${{ github.sha }}
          path: m11-evidence/recovery.log
          if-no-files-found: error
          retention-days: 30

  containers:
    name: Production containers
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build production containers with provenance metadata
        run: |
          mkdir -p m11-evidence
          docker buildx bake -f infrastructure/containers/docker-bake.hcl \
            --metadata-file m11-evidence/container-metadata.json \
            default database-migrate
      - name: Retain container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m11-containers-${{ github.sha }}
          path: m11-evidence/container-metadata.json
          if-no-files-found: error
          retention-days: 30

  # Stable required check: M9 Production Readiness / Gate
  gate:
    name: M9 Production Readiness / Gate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [containers, core, integration-recovery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CORE_RESULT: ${{ needs.core.result }}
      CONTAINERS_RESULT: ${{ needs.containers.result }}
      INTEGRATION_RESULT: ${{ needs.integration-recovery.result }}
    steps:
      - name: Require every M9 lane
        run: |
          test "$CORE_RESULT" = success
          test "$CONTAINERS_RESULT" = success
          test "$INTEGRATION_RESULT" = success
