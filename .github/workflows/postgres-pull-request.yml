name: PostgreSQL integration (local)

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

concurrency:
  group: postgres-pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: Migrations and PostgreSQL profile conformance
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # These credentials are synthetic, local-only compose defaults. This
    # workflow contains no repository-secret references and never connects to Neon.
    env:
      DATABASE_ADMIN_URL: postgresql://control_plane_admin:local-admin-only@127.0.0.1:54329/postgres
      DATABASE_MIGRATION_URL: postgresql://control_plane_migrator:local-migration-only@127.0.0.1:54329/control_plane
      DATABASE_URL: postgresql://control_plane_app:local-application-only@127.0.0.1:54329/control_plane
      DATABASE_URL_UNPOOLED: postgresql://control_plane_app:local-application-only@127.0.0.1:54329/control_plane
      RUN_M10_POSTGRES_CONFORMANCE: 'true'
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start local PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Verify migrations
        run: |
          bun run db:check
          bun --cwd=packages/database run db:migrate

      - name: Verify cross-profile conformance matrix (Postgres)
        run: bun test tests/cp1-embedded-durable-execution.test.mjs

      - name: Verify integration and recovery behavior
        run: bun run test:integration
