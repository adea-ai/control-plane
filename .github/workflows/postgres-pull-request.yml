name: PostgreSQL integration (local)

on:
  workflow_call: {}

permissions: {}

concurrency:
  group: postgres-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: Migrations and PostgreSQL profile conformance
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # These credentials are synthetic, local-only compose defaults. This
    # workflow contains no repository-secret references and never connects to production.
    env:
      DATABASE_ADMIN_URL: postgresql://control_plane_admin:local-admin-only@127.0.0.1:54329/postgres
      DATABASE_MIGRATION_URL: postgresql://control_plane_migrator:local-migration-only@127.0.0.1:54329/control_plane
      DATABASE_URL: postgresql://control_plane_app:local-application-only@127.0.0.1:54329/control_plane
      DATABASE_URL_UNPOOLED: postgresql://control_plane_app:local-application-only@127.0.0.1:54329/control_plane
      COMPOSE_PROJECT_NAME: control-plane-pr-${{ github.run_id }}-${{ github.run_attempt }}
      RUN_M10_POSTGRES_CONFORMANCE: 'true'
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Build
        timeout-minutes: 5
        run: bun run build

      - name: Pull local PostgreSQL image
        timeout-minutes: 5
        run: bun scripts/pull-postgres-image.mjs

      - name: Start local PostgreSQL
        timeout-minutes: 5
        run: docker compose up -d --wait postgres

      - name: Verify migrations
        timeout-minutes: 5
        run: |
          bun run db:check
          bun --cwd=packages/database run db:migrate

      - name: Verify fresh schema bootstrap
        timeout-minutes: 5
        env:
          RUN_CP_FRESH_SCHEMA_ACCEPTANCE: 'true'
        run: bun test --timeout 30000 ./packages/database/src/fresh-schema-bootstrap.integration.test.mjs

      - name: Verify migrations without database-wide CREATE
        timeout-minutes: 5
        env:
          SCOPED_MIGRATION_TEST_ADMIN_URL: ${{ env.DATABASE_ADMIN_URL }}
        run: bun test ./packages/database/src/scoped-migrations.integration.test.mjs

      - name: Verify the pool teardown releases its connections
        timeout-minutes: 5
        env:
          RUN_DATABASE_INTEGRATION: 'true'
        run: bun test --timeout 30000 ./packages/database/src/pool-teardown.integration.test.mjs

      - name: Verify cross-profile conformance matrix (Postgres)
        timeout-minutes: 5
        run: bun test tests/cp1-embedded-durable-execution.test.mjs

      - name: Verify Hosted PostgreSQL and Restate graph
        timeout-minutes: 5
        # This scenario has one explicit owner and requires a live Restate
        # process; the qualification script rejects skips and cleans its fixture.
        run: bash scripts/run-hosted-graph-qualification.sh

      - name: Remove owned PostgreSQL fixture
        if: always()
        timeout-minutes: 3
        run: docker compose down --volumes --remove-orphans --timeout 60
