services:
  native-pi-certification:
    image: ${CONTROL_PLANE_PI_CERTIFICATION_IMAGE:-control-plane/native-pi-certification:0.84.2}
    build:
      context: ../..
      dockerfile: infrastructure/containers/Dockerfile.hosted
      target: runtime-managed-pi-certification
    profiles: [native-pi-test]
    environment:
      M11_REAL_PI_DURABLE_EXECUTION: ${M11_REAL_PI_DURABLE_EXECUTION:-embedded-sqlite}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
      - /home/node:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
      - /var/lib/control-plane:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: 'no'
    stop_grace_period: 30s
