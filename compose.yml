name: agent-hq

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_hq
      POSTGRES_PASSWORD: agent_hq_local_admin
      POSTGRES_USER: agent_hq_local_admin
    ports:
      - '127.0.0.1:${ADEA_POSTGRES_PORT:-55432}:5432'
    volumes:
      - agent-hq-postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U agent_hq_local_admin -d agent_hq']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  agent-hq-postgres-data:
